[project]
name = "restaurant-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rohit Das", email = "realview321@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "groq>=1.6.0",
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.4",
    "numpy>=2.5.3",
    "pydantic>=2.13.4",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.0.1",
    "tavily-python>=0.8.4",
    "uvicorn>=0.52.4",
]

[project.scripts]
restaurant-agent = "restaurant_agent:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
